---
# Postgres runs inside the pi-cluster-postgres-1 container, backed up via
# `docker exec` (not `docker compose exec`) so this never needs read access
# to /home/admin/pi-cluster, which Jenkins' rsync leaves root-owned.
# Dumped as the pi_cluster superuser regardless of which role owns each
# database (household services get their own scoped Postgres role for the
# app itself, e.g. `wallabag` — this is only for backup, where a superuser
# dump is simpler than granting each service's role dump rights too).
backup_postgres_container: pi-cluster-postgres-1
backup_postgres_user: pi_cluster
# One database per platform component or household service sharing this
# Postgres instance. Add a new service's database name here when it's
# added — see docs/decisions.md's Wallabag ADR (D2).
backup_postgres_databases:
  - pi_cluster
  - wallabag

# Where backups are assembled on pi-node1 before being shipped out.
backup_local_dir: /home/admin/backups
backup_local_keep: 3

# Where they're shipped to and how many daily snapshots survive there.
# Must be an address pi-node1 can actually resolve — it isn't an Ansible
# control node with the inventory's hostname aliases available, it's the
# managed host running this script standalone via cron, so the bare
# inventory name "pi-node4" doesn't resolve there. Use the real IP.
backup_target_host: 10.100.102.12
backup_remote_path: /home/admin/pi-cluster-backups
backup_remote_keep: 14

# Dedicated key so this doesn't ride on anyone's personal SSH identity.
backup_ssh_key_path: /home/admin/.ssh/id_backup

# Cron schedule (defaults to 02:30 daily).
backup_cron_hour: "2"
backup_cron_minute: "30"
