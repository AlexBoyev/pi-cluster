---
- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Install required packages
  apt:
    name:
      - curl
      - wget
      - git
      - htop
      - vim
      - ufw
      - ntp
      - python3-pip
      - open-iscsi
      - nfs-common
    state: present
  become: yes

- name: Enable and start NTP
  systemd:
    name: ntp
    enabled: yes
    state: started
  become: yes

- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"
  become: yes

- name: Disable swap
  command: swapoff -a
  become: yes
  changed_when: false

- name: Remove swap from fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'
  become: yes

- name: Enable cgroups for K3s (cmdline.txt for Raspberry Pi)
  # /boot/cmdline.txt is a placeholder on Raspberry Pi OS Bookworm+ ("DO NOT
  # EDIT THIS FILE, the file you are looking for has moved to
  # /boot/firmware/cmdline.txt") — this task silently did nothing against
  # the real boot config until caught while diagnosing the 2026-09-07
  # outage. See docs/decisions.md.
  lineinfile:
    path: /boot/firmware/cmdline.txt
    backrefs: yes
    regexp: '^((?!.*cgroup_enable=cpuset).*)$'
    line: '\1 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory'
  become: yes
  notify: reboot node

- name: Force usb-storage driver instead of uas for the ASMedia USB-SATA bridge
  # All 4 nodes' Kingston SA400S37 SSDs sit behind an ASMedia ASM235CM
  # bridge (USB ID 174c:235c) whose `uas` driver hangs on the first burst
  # of small reads after a cold boot on Raspberry Pi — a known class of Pi
  # + USB-SSD issue. Caused an 18+ minute full outage on 2026-09-07: every
  # worker's Traefik pod got stuck inside its own entrypoint's `traefik
  # --help` self-check, blocked in kernel disk-wait (D state, unkillable)
  # trying to read the traefik binary. Confirmed independent per-node (not
  # cross-node contention) by observing the identical hang recur in
  # isolation even after staggering boot times. See docs/decisions.md.
  lineinfile:
    path: /boot/firmware/cmdline.txt
    backrefs: yes
    regexp: '^((?!.*usb-storage\.quirks=174c:235c:u).*)$'
    line: '\1 usb-storage.quirks=174c:235c:u'
  become: yes
  notify: reboot node

- name: Ensure node-exporter textfile collector directory exists
  file:
    path: /var/lib/node-exporter/textfile-collector
    state: directory
    owner: admin
    group: admin
    mode: "0755"
  become: yes

- name: Deploy Raspberry Pi throttle/undervoltage metrics script
  copy:
    src: rpi_throttle_metrics.sh
    dest: /home/admin/rpi_throttle_metrics.sh
    owner: admin
    group: admin
    mode: "0700"
  become: yes

- name: Schedule Raspberry Pi throttle metrics collection via cron
  # Firmware undervoltage (checked live via vcgencmd) is the same condition
  # that took down every pod on pi-node3 on 2026-09-08 - see docs/decisions.md.
  cron:
    name: "rpi throttle metrics"
    user: admin
    minute: "*"
    job: "/home/admin/rpi_throttle_metrics.sh"
  become: yes

- name: Configure UFW — allow SSH
  ufw:
    rule: allow
    port: "22"
    proto: tcp
  become: yes

- name: Configure UFW — allow K3s API
  ufw:
    rule: allow
    port: "6443"
    proto: tcp
  become: yes

- name: Enable UFW
  ufw:
    state: enabled
    policy: deny
  become: yes
