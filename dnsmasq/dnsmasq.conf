# Serve DNS only, no DHCP
no-dhcp-interface=

# Wildcard: resolve anything *.pi-cluster.local to pi-node1
address=/.pi-cluster.local/10.100.102.10

# Upstream DNS servers (fallback for all other queries)
server=8.8.8.8
server=8.8.4.4

# Don't read /etc/hosts or /etc/resolv.conf from the host
no-hosts
no-resolv

# Listen on LAN and loopback only
listen-address=10.100.102.10,127.0.0.1

# Don't forward short hostnames (no dots) upstream
domain-needed

# Don't forward queries for private IP ranges upstream
bogus-priv
