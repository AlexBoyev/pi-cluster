groups:
  - name: node-health
    interval: 30s
    rules:
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node_name }} unreachable"
          description: "node-exporter on {{ $labels.node_name }} has been unreachable for more than 2 minutes"

      - alert: HighCPU
        expr: 100 - avg by (node_name) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m]) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.node_name }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% (threshold: 85%)"

      - alert: HighMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory on {{ $labels.node_name }}"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}% (threshold: 85%)"

      - alert: HighDisk
        expr: 100 * (1 - node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype!="tmpfs"}) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage on {{ $labels.node_name }}"
          description: "Disk usage is {{ $value | printf \"%.1f\" }}% (threshold: 80%)"

      - alert: HighTemperature
        expr: node_thermal_zone_temp{job="node-exporter",type="cpu-thermal"} > 70
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High temperature on {{ $labels.node_name }}"
          description: "CPU temperature is {{ $value | printf \"%.1f\" }}°C (threshold: 70°C)"

      # rpi_throttle_metrics.sh (ansible/roles/common), polled every minute,
      # feeds node-exporter's textfile collector. Root-caused the 2026-09-08
      # pi-node3 incident (firefly-cron crash-loop alerts were a symptom, not
      # the cause): a marginal PSU/cable sagging under the combined
      # board+USB-SSD draw. See docs/decisions.md.
      - alert: NodeUndervoltage
        expr: node_rpi_throttled_bit{job="node-exporter",bit="undervoltage_now"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.node_name }} is currently under-voltage"
          description: "vcgencmd reports live undervoltage on {{ $labels.node_name }} - board is brownout-cycling, expect pods on this node to restart. Hardware/power issue, not fixable by restarting the node."

      - alert: NodeThrottled
        expr: node_rpi_throttled_bit{job="node-exporter",bit="throttled_now"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.node_name }} is currently CPU-throttled"
          description: "vcgencmd reports live frequency throttling on {{ $labels.node_name }}, usually caused by undervoltage."

  - name: pod-health
    interval: 30s
    rules:
      # Requires kube-state-metrics (job=kube-state-metrics) — node-exporter
      # only exposes host-level metrics, nothing pod/container-level. Added
      # after a Traefik pod on pi-node1 crash-looped 8+ times over days with
      # zero alerting, because nothing scraped pod restart counts.
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{job="kube-state-metrics"}[1h]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
          description: "Container {{ $labels.container }} has restarted {{ $value | printf \"%.0f\" }} times in the last hour"

      - alert: PodNotReady
        # Excludes Succeeded pods - a completed Job/CronJob pod's Ready
        # condition is permanently False (reason: PodCompleted), which made
        # this fire forever on every cron run with no way to auto-clear
        # (caught 2026-09-08 on firefly-cron, PodNotReady stuck 3h+ on an
        # already-successful run). See docs/decisions.md.
        expr: |
          sum by (namespace, pod) (kube_pod_status_ready{job="kube-state-metrics", condition="false"})
          unless on (namespace, pod) (kube_pod_status_phase{job="kube-state-metrics", phase="Succeeded"} == 1)
          > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} not ready"
          description: "Pod has been in a non-ready state for over 15 minutes"
