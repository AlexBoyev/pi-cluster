groups:
  - name: node-health
    interval: 30s
    rules:
      - alert: NodeDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.node_name }} unreachable"
          description: "node-exporter on {{ $labels.node_name }} has been unreachable for more than 2 minutes"

      - alert: HighCPU
        expr: 100 - avg by (node_name) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m]) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.node_name }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% (threshold: 85%)"

      - alert: HighMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory on {{ $labels.node_name }}"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}% (threshold: 85%)"

      - alert: HighDisk
        expr: 100 * (1 - node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype!="tmpfs"}) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage on {{ $labels.node_name }}"
          description: "Disk usage is {{ $value | printf \"%.1f\" }}% (threshold: 80%)"

      - alert: HighTemperature
        expr: node_thermal_zone_temp{job="node-exporter",type="cpu-thermal"} > 70
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High temperature on {{ $labels.node_name }}"
          description: "CPU temperature is {{ $value | printf \"%.1f\" }}°C (threshold: 70°C)"

  - name: pod-health
    interval: 30s
    rules:
      # Requires kube-state-metrics (job=kube-state-metrics) — node-exporter
      # only exposes host-level metrics, nothing pod/container-level. Added
      # after a Traefik pod on pi-node1 crash-looped 8+ times over days with
      # zero alerting, because nothing scraped pod restart counts.
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{job="kube-state-metrics"}[1h]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
          description: "Container {{ $labels.container }} has restarted {{ $value | printf \"%.0f\" }} times in the last hour"

      - alert: PodNotReady
        expr: sum by (namespace, pod) (kube_pod_status_ready{job="kube-state-metrics", condition="false"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} not ready"
          description: "Pod has been in a non-ready state for over 15 minutes"
