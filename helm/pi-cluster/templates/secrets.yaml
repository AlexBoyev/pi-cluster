apiVersion: v1
kind: Secret
metadata:
  name: pi-cluster-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "pi-cluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgresql://{{ .Values.postgres.user }}:{{ .Values.secrets.dbPassword }}@postgres:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
  REDIS_URL: "redis://:{{ .Values.secrets.redisPassword }}@redis:{{ .Values.redis.port }}/0"
  JWT_SECRET: "{{ .Values.secrets.jwtSecret }}"
  PROMETHEUS_URL: "{{ .Values.secrets.prometheusUrl }}"
