events {
    worker_connections 1024;
}

http {
    # Which platform hostname to bounce back to on a failed SSO check -
    # matches whichever domain family the request actually came in on, since
    # the pi_sso cookie (and login session) only exists on one of the two.
    map $host $pi_platform_root {
        ~\.cluster\.download$  pi.cluster.download;
        default                pi-cluster.lan;
    }

    # Household services (Wallabag, and whatever follows it) live behind K8s
    # Ingress + Traefik on pi-node2/3/4, not behind a platform hostname here.
    # max_fails/fail_timeout give passive health checks — one worker down
    # doesn't take routing down with it, since Traefik runs on all three.
    upstream traefik_workers {
        server 10.100.102.16:80 max_fails=2 fail_timeout=10s;
        server 10.100.102.17:80 max_fails=2 fail_timeout=10s;
        server 10.100.102.12:80 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name pi-cluster.lan pi.cluster.download;

        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Vite's dev proxy (frontend/vite.config.ts) rewrites Host to
            # the backend target (changeOrigin: true) before /api requests
            # reach FastAPI, so anything there needing the real request host
            # (e.g. auth.py's platform-root redirect) has to read this
            # instead of request.headers["host"].
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    server {
        listen 80;
        server_name api.pi-cluster.lan api.cluster.download;

        location /api/v1/vault {
            allow 10.100.102.0/24;
            deny all;
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 80;
        server_name grafana.pi-cluster.lan grafana.cluster.download;

        location / {
            proxy_pass http://grafana:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80;
        server_name prometheus.pi-cluster.lan prometheus.cluster.download;

        # Prometheus has no authentication of its own — unlike Grafana/Jenkins
        # (own login) this hostname must never be reachable off the LAN, even
        # if it's routed through the Cloudflare Tunnel.
        allow 10.100.102.0/24;
        deny all;

        location / {
            proxy_pass http://prometheus:9090;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80;
        server_name alertmanager.pi-cluster.lan alertmanager.cluster.download;

        # Same as Prometheus above — AlertManager has no auth of its own.
        allow 10.100.102.0/24;
        deny all;

        location / {
            proxy_pass http://alertmanager:9093;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 80;
        server_name jenkins.pi-cluster.lan jenkins.cluster.download;

        location / {
            proxy_pass http://jenkins:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Wildcard fallback: any hostname not matched by a specific block above
    # (i.e. not part of the platform itself) forwards to Traefik, which
    # routes by Host header to the matching K8s Ingress. New household
    # services need nothing here — just a K8s Ingress. Built once for
    # Wallabag; see docs/decisions.md.
    #
    # SSO gate: household services have their own independent login (see
    # docs/architecture.md), but you shouldn't be able to reach one at all
    # without an active pi-cluster session first. auth_request checks the
    # pi_sso cookie (set on platform login, domain .pi-cluster.lan) against
    # the backend on every request; anyone without it gets bounced to the
    # platform login instead of ever seeing the household service.
    server {
        listen 80 default_server;
        server_name *.pi-cluster.lan *.cluster.download;

        location = /_pi_sso_verify {
            internal;
            proxy_pass http://backend:8000/api/v1/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        # Completes the Wallabag auto-login bridge (backend/app/api/v1/auth.py) -
        # proxied straight to the backend, not Traefik, so the browser sees
        # this response as coming from wallabag.cluster.download itself and
        # the PHPSESSID cookie it sets can be host-only (matching, and
        # cleanly replacing, whatever Wallabag's own login would set).
        # Exempt from the auth_request gate above: reaching this path at all
        # already required passing that same check inside /wallabag-sso.
        location = /__wallabag_sso_finish {
            proxy_pass http://backend:8000/api/v1/auth/wallabag-sso-finish;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Same completion step for Vikunja's bridge - see
        # backend/app/api/v1/auth.py's vikunja-sso-finish.
        location = /__vikunja_sso_finish {
            proxy_pass http://backend:8000/api/v1/auth/vikunja-sso-finish;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # CalDAV (Vikunja's /dav/*, and any future service's equivalent)
        # must never sit behind an interactive gate: DAVx5/iOS authenticate
        # with plain HTTP Basic Auth and can't follow a redirect to an HTML
        # login page. Exempt from auth_request entirely - Vikunja's own
        # per-user app-password Basic Auth is the only gate here, by design
        # (see docs/decisions.md). Placed before the general location / so
        # it takes precedence.
        location ~ ^/dav/ {
            proxy_pass http://traefik_workers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            auth_request /_pi_sso_verify;
            error_page 401 = @pi_sso_login;
            proxy_pass http://traefik_workers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location @pi_sso_login {
            return 302 http://$pi_platform_root/login;
        }
    }
}
