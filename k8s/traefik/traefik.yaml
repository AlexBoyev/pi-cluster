---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: traefik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets, nodes]
    verbs: [get, list, watch]
  # Traefik v3 resolves backend pod IPs via EndpointSlices, not the legacy
  # core/v1 Endpoints above — without this, Traefik can see every Ingress
  # and Service just fine but can never actually route to a pod (404 on
  # every request). Missing since this file was first written; found while
  # deploying Wallabag, the first real Ingress-routed workload on this
  # cluster — see docs/decisions.md.
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: traefik
  namespace: traefik
  labels:
    app: traefik
spec:
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      # Excluded from pi-node1: Docker Compose's nginx already binds host
      # ports 80/443 there, so Traefik's hostPort binding on that node
      # conflicts with it and crash-loops indefinitely. See docs/decisions.md.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - pi-node1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      containers:
        - name: traefik
          image: traefik:v3.1
          args:
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --entrypoints.websecure.http.tls=true
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=traefik
            - --providers.kubernetesingress.allowExternalNameServices=true
            - --log.level=INFO
            - --ping=true
            - --ping.entrypoint=web
          ports:
            - name: web
              containerPort: 80
              hostPort: 80
              protocol: TCP
            - name: websecure
              containerPort: 443
              hostPort: 443
              protocol: TCP
          # No probes previously — kubelet reported the pod Ready as soon as
          # the container process existed, even though the entrypoint's own
          # `traefik --help` self-check can hang for minutes under node I/O
          # pressure (a cold-boot storm on all 4 nodes at once) before
          # Traefik ever execs and binds :80. Ready was a lie during the
          # 2026-09-07 outage — this makes it real. See docs/decisions.md.
          # startupProbe gates the other two: a wedged first boot can take
          # up to 10 minutes (worse than the ~18 observed, with headroom)
          # without livenessProbe killing it and adding more I/O to an
          # already-saturated disk. Once it succeeds once, normal
          # readiness/liveness periods apply.
          startupProbe:
            httpGet:
              path: /ping
              port: 80
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ping
              port: 80
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: 80
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: traefik.io/ingress-controller
