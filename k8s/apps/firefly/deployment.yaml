apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly
  namespace: firefly
  labels:
    app: firefly
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate - local-path is ReadWriteOnce, same as
    # every prior household service.
    type: Recreate
  selector:
    matchLabels:
      app: firefly
  template:
    metadata:
      labels:
        app: firefly
    spec:
      # Pinned to pi-node3, alongside Wallabag and Vikunja - light
      # footprint, well under allocatable. See docs/decisions.md, Firefly D3.
      nodeSelector:
        kubernetes.io/hostname: pi-node3
      containers:
        - name: firefly
          # Verified against the Docker Hub registry API (not just a docs
          # page) that this tag's manifest list includes linux/arm64 - see
          # docs/decisions.md.
          image: fireflyiii/core:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: firefly-config
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: firefly-secret
                  key: app-key
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-secret
                  key: db-password
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: firefly-secret
                  key: mail-username
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-secret
                  key: mail-password
            - name: STATIC_CRON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firefly-secret
                  key: cron-token
          volumeMounts:
            - name: data
              mountPath: /var/www/html/storage/upload
          resources:
            # pi-node3 already hosts Wallabag (512Mi limit) and Vikunja
            # (384Mi limit); Firefly is comparable PHP/Laravel weight to
            # Wallabag, sized the same rather than assumed lighter.
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # TCP-only, deliberately - no confirmed unauthenticated lightweight
          # HTTP endpoint exists for this image as of writing (checked, not
          # assumed - see docs/decisions.md). Upgrade to an HTTP probe once
          # one is verified live rather than guess a path that might 404 or
          # redirect unpredictably under remote_user_guard.
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: firefly-data
