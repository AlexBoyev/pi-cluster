# Reached via the standard household-services wildcard fallback (nginx's
# pi_sso gate) - not the dedicated firefly.* block, which is reserved for
# Firefly itself. See docs/decisions.md Firefly D4.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firefly-importer
  namespace: firefly
spec:
  ingressClassName: traefik
  rules:
    - host: firefly-import.pi-cluster.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: firefly-importer
                port:
                  number: 80
    - host: firefly-import.cluster.download
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: firefly-importer
                port:
                  number: 80
