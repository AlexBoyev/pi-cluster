apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallabag
  namespace: wallabag
  labels:
    app: wallabag
spec:
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: local-path is ReadWriteOnce, a second pod
    # couldn't mount the same PVC anyway while the old one terminates.
    type: Recreate
  selector:
    matchLabels:
      app: wallabag
  template:
    metadata:
      labels:
        app: wallabag
    spec:
      # Pinned to pi-node3, not just "wherever the PVC lands" — see
      # docs/decisions.md (D1). Also excludes pi-node1, which takes no user
      # workloads.
      nodeSelector:
        kubernetes.io/hostname: pi-node3
      containers:
        - name: wallabag
          # Pinned, never latest. Verified against the Docker Hub registry
          # API (not just a docs page) that this tag's manifest list
          # includes linux/arm64 — see docs/decisions.md.
          image: wallabag/wallabag:2.6.14
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: wallabag-config
          env:
            - name: SYMFONY__ENV__DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallabag-secret
                  key: database-password
            # The entrypoint's own install-trigger logic (not the Symfony
            # app config) separately checks POSTGRES_PASSWORD to decide
            # whether to run wallabag:install — without it, POPULATE_DATABASE
            # is silently ignored and the schema never gets created. Found
            # by reading the actual entrypoint source after a real deploy
            # attempt failed with "relation ... does not exist". Same value
            # as the wallabag role's password above (it owns the database,
            # so no separate superuser credential is needed).
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wallabag-secret
                  key: database-password
            - name: SYMFONY__ENV__SECRET
              valueFrom:
                secretKeyRef:
                  name: wallabag-secret
                  key: symfony-secret
          volumeMounts:
            - name: data
              mountPath: /var/www/wallabag/data
              subPath: data
            - name: data
              mountPath: /var/www/wallabag/web/assets/images
              subPath: images
          resources:
            # pi-node3: ~7.8Gi allocatable. Existing DaemonSets there
            # (node-exporter, promtail, traefik) reserve well under 400Mi
            # combined at their own limits. 512Mi limit here leaves ~6.9Gi
            # free — not a tight fit, sized for "one Pi running one
            # household app for 2 people," not padded further. 500m CPU
            # limit covers a burst during article-fetch/readability
            # extraction without one request starving the node's other 3
            # cores.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # No dedicated health endpoint shipped by this image; /login is
          # the standard community probe target (real HTTP response, not a
          # bare TCP check). Generous initialDelay: the image's entrypoint
          # runs `composer install` on every container start (confirmed by
          # reading the entrypoint source), which is slow on Pi-class ARM
          # hardware/SD storage — this is why pod restarts are not fast,
          # documented in docs/operations.md.
          startupProbe:
            httpGet:
              path: /login
              port: 80
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 80
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /login
              port: 80
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wallabag-data
