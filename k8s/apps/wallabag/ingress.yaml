# Reachable via nginx's wildcard fallback -> Traefik (pi-node2/3/4) -> this
# Ingress. Traefik's ingress provider matches Host header by exact string
# against spec.rules[].host, so Cloudflare Tunnel exposure via
# wallabag.cluster.download needed a second rule here too, not just a
# Cloudflare-side route — the original comment claiming "no change needed
# here" was wrong (docs/decisions.md has the correction). Both hosts route
# to the same pod either way; SYMFONY__ENV__DOMAIN_NAME (configmap.yaml) is
# pinned to wallabag.cluster.download as the one canonical domain, since
# Wallabag renders every asset as an absolute url from that single value —
# wallabag.pi-cluster.lan still routes here fine but renders unstyled.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallabag
  namespace: wallabag
spec:
  ingressClassName: traefik
  rules:
    - host: wallabag.pi-cluster.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wallabag
                port:
                  number: 80
    - host: wallabag.cluster.download
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wallabag
                port:
                  number: 80
