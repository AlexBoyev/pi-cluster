# Non-secret configuration. DATABASE_PASSWORD and SECRET live in the
# wallabag-secret Secret instead — created manually, never in git. See
# k8s/apps/wallabag/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wallabag-config
  namespace: wallabag
data:
  # Must exactly match the real ingress URL, including scheme — wallabag's
  # single most common misconfiguration. See docs/decisions.md. Wallabag
  # renders every asset (CSS/JS/logo) as an ABSOLUTE url built from this
  # single value, so it can only ever look right on one canonical hostname —
  # picked cluster.download since that's reachable both from the LAN
  # (dnsmasq split-horizon) and publicly; wallabag.pi-cluster.lan still
  # works for browsing but renders unstyled (assets point at this domain).
  SYMFONY__ENV__DOMAIN_NAME: "https://wallabag.cluster.download"

  # Postgres runs in Docker Compose on pi-node1, not in K8s — reached over
  # the LAN, not a K8s Service. Port 5432 is published on the host
  # (docker-compose.yml).
  SYMFONY__ENV__DATABASE_DRIVER: "pdo_pgsql"
  SYMFONY__ENV__DATABASE_HOST: "10.100.102.10"
  SYMFONY__ENV__DATABASE_PORT: "5432"
  SYMFONY__ENV__DATABASE_NAME: "wallabag"
  SYMFONY__ENV__DATABASE_USER: "wallabag"
  SYMFONY__ENV__DATABASE_TABLE_PREFIX: "wallabag_"
  SYMFONY__ENV__DATABASE_CHARSET: "utf8"

  # Separate from the SYMFONY__ENV__DATABASE_* vars above: the entrypoint
  # script's OWN wait-for-database/install-trigger logic uses these,
  # mirroring the standard `postgres` image's bootstrap convention (and
  # defaults DATABASE_USER to "root" if unset, which is not this database's
  # actual user). Found only by testing a real deploy — not documented
  # anywhere upstream that this WebFetch/WebSearch could find.
  POSTGRES_USER: "wallabag"
  POSTGRES_DB: "wallabag"

  # Does NOT actually auto-install the schema in this setup — the
  # entrypoint sees the pre-created (but empty) database from
  # README.md step 1 and concludes "already configured," skipping
  # install regardless of this flag. wallabag:install has to be run
  # once manually (README.md step 4). Left "True" anyway since it's
  # otherwise harmless and matches upstream's own default.
  POPULATE_DATABASE: "True"

  # Closed by default upstream; set explicitly for clarity. Re-verify after
  # creating the two real accounts.
  SYMFONY__ENV__FOSUSER_REGISTRATION: "false"
  SYMFONY__ENV__FOSUSER_CONFIRMATION: "true"

  # Mailer intentionally left unconfigured — password reset will not work.
  # Accepted tradeoff for 2 users with direct SSH access; see
  # docs/decisions.md.
