apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://10.100.102.10:3100/loki/api/v1/push

    scrape_configs:
      # K3s pod logs, all 4 nodes. Path is built from the pod UID under
      # /var/log/pods — the standard containerd/K3s log location — matching
      # the directory naming <namespace>_<pod>_<uid>/<container>/*.log.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node_name
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_uid]
            target_label: __path__
            # One level deeper than it looks: real files are
            # <ns>_<pod>_<uid>/<container>/<N>.log, not .../<uid>/*.log —
            # confirmed by listing an actual pod's log directory on
            # pi-node1. The glob without the extra */ silently matched
            # nothing, cluster-wide, since this file was first written.
            replacement: /var/log/pods/*$1/*/*.log

      # Docker Compose platform containers (backend, postgres, jenkins, etc.)
      # — only present on pi-node1, where the compose stack actually runs;
      # this job finds nothing on pi-node2/3/4.
      - job_name: docker-compose-platform
        static_configs:
          - targets: [localhost]
            labels:
              job: docker-compose
              node_name: pi-node1
              __path__: /var/lib/docker/containers/*/*-json.log
        pipeline_stages:
          - json:
              expressions:
                output: log
                stream: stream
                time: time
          - timestamp:
              source: time
              format: RFC3339Nano
          - output:
              source: output
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      # Root cause of a "0 active targets" bug, found the hard way: Promtail
      # auto-injects a k8s SD field selector (spec.nodeName=$self-hostname)
      # to only watch pods on its own node — a sensible DaemonSet
      # optimization. But a container's hostname (Go's os.Hostname(), which
      # reads the kernel/UTS-namespace hostname — NOT the HOSTNAME env var;
      # setting that alone does nothing here, tried it first) defaults to
      # the pod name, not the node's real hostname, so the selector became
      # spec.nodeName=<this promtail pod's own name>, matching nothing on
      # every node, cluster-wide. hostNetwork shares the node's real UTS
      # namespace — same reason node-exporter already uses it. Confirmed
      # node hostnames match K8s node names exactly (`hostname` on
      # pi-node1 == `kubectl get nodes` output) before relying on this.
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: promtail
          # Bumped from 2.9.4 while chasing this bug, initially suspecting
          # a client-go/K3s version mismatch — that theory turned out wrong
          # (the hostNetwork fix above was the actual cause), but kept the
          # bump anyway as a reasonable modernization; arm64 support
          # verified directly against the registry.
          image: grafana/promtail:3.6.11
          args:
            - -config.file=/etc/promtail/promtail.yaml
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
        - name: docker-containers
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
        - name: positions
          emptyDir: {}
