apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://10.100.102.10:3100/loki/api/v1/push

    scrape_configs:
      # K3s pod logs, all 4 nodes. Path is built from the pod UID under
      # /var/log/pods — the standard containerd/K3s log location — matching
      # the directory naming <namespace>_<pod>_<uid>/<container>/*.log.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node_name
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_uid]
            target_label: __path__
            # One level deeper than it looks: real files are
            # <ns>_<pod>_<uid>/<container>/<N>.log, not .../<uid>/*.log —
            # confirmed by listing an actual pod's log directory on
            # pi-node1. The glob without the extra */ silently matched
            # nothing, cluster-wide, since this file was first written.
            replacement: /var/log/pods/*$1/*/*.log

      # Docker Compose platform containers (backend, postgres, jenkins, etc.)
      # — only present on pi-node1, where the compose stack actually runs;
      # this job finds nothing on pi-node2/3/4.
      - job_name: docker-compose-platform
        static_configs:
          - targets: [localhost]
            labels:
              job: docker-compose
              node_name: pi-node1
              __path__: /var/lib/docker/containers/*/*-json.log
        pipeline_stages:
          - json:
              expressions:
                output: log
                stream: stream
                time: time
          - timestamp:
              source: time
              format: RFC3339Nano
          - output:
              source: output
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      tolerations:
        - operator: Exists
      containers:
        - name: promtail
          # 2.9.4 originally, but its client-go was too old to talk to this
          # cluster's K3s 1.36.3 correctly — the Kubernetes pod-discovery
          # scrape job silently returned 0 targets (confirmed: RBAC was
          # fine, the raw API call worked when impersonating promtail's own
          # identity, only Promtail's own client never got results).
          # Bumped to current; verified arm64 support directly against the
          # registry, same as every other pinned image in this repo.
          image: grafana/promtail:3.6.11
          args:
            - -config.file=/etc/promtail/promtail.yaml
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: pods-logs
              mountPath: /var/log/pods
              readOnly: true
            - name: docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: positions
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pods-logs
          hostPath:
            path: /var/log/pods
            type: DirectoryOrCreate
        - name: docker-containers
          hostPath:
            path: /var/lib/docker/containers
            type: DirectoryOrCreate
        - name: positions
          emptyDir: {}
