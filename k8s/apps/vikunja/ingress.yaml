# Reachable via nginx's wildcard fallback -> Traefik (pi-node2/3/4) -> this
# Ingress, same path as Wallabag. Two host rules for the same reason
# Wallabag's ended up needing them: Traefik's ingress provider matches Host
# by exact string against spec.rules[].host, so both the LAN and public
# hostnames need their own entry (docs/decisions.md has the Wallabag
# correction this avoids repeating blind).
#
# CalDAV note: /dav/* on this same hostname bypasses the platform's pi_sso
# gate at the nginx layer (nginx/nginx.conf) — nothing to configure here,
# Traefik/this Ingress see the same single Service either way.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vikunja
  namespace: vikunja
spec:
  ingressClassName: traefik
  rules:
    - host: vikunja.pi-cluster.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vikunja
                port:
                  number: 80
    - host: vikunja.cluster.download
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vikunja
                port:
                  number: 80
